name: TimeCasket
options:
  bundleIdPrefix: io.github.coderleexl
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.27'
    CURRENT_PROJECT_VERSION: '29'
    PRODUCT_BUNDLE_IDENTIFIER: io.github.coderleexl.rocoapp
    CODE_SIGN_STYLE: Automatic
targets:
  TimeCasket:
    type: application
    platform: iOS
    sources:
      - path: TimeCasket
        excludes: [Resources, bridge.js]
      - path: TimeCasket/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coderleexl.rocoapp
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  TimeCasket:
    build:
      targets:
        TimeCasket: all
