<!doctype html><meta charset="utf-8"><title>probe-loading</title>
<script>window.RufflePlayer={config:{autoplay:'on',preferredRenderer:'webgl',unmuteOverlay:'hidden',logLevel:'warn'}};window.imageProbeStep=(phase,color)=>fetch('/step?phase='+phase+'&color='+color);window.imageProbeResult=(ok,count)=>{document.title='probe-'+ok+'-'+count;fetch('/result?ok='+ok+'&count='+count)};</script>
<script>for(const level of ['error','warn']){const original=console[level];console[level]=(...args)=>{fetch('/error?message='+encodeURIComponent(args.filter(v=>typeof v==='string').join(' ').slice(0,1800)));original(...args)}};</script><script src="/dist/ruffle.js"></script><object type="application/x-shockwave-flash" data="/probe.swf" width="300" height="80"></object><script>window.postMessage({to:'ruffle_page',index:0,id:1,data:{type:'load',publicPath:location.origin+'/dist/ruffle.js',config:{}}},'*');</script>
