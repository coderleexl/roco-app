name: iOS unsigned IPA and experimental release
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test ios/scripts/bridge.test.cjs
      - run: brew install xcodegen
      - name: Build device app without signing
        run: bash ios/scripts/build_unsigned.sh
      - name: Verify actual device binary and embedded runtime
        run: |
          app=ios/build/DerivedData/Build/Products/Release-iphoneos/TimeCasket.app
          test -s "$app/TimeCasket"
          lipo "$app/TimeCasket" -verify_arch arm64
          plutil -lint "$app/Info.plist"
          python3 - <<'PY'
          import hashlib,json,pathlib
          app=pathlib.Path('ios/build/DerivedData/Build/Products/Release-iphoneos/TimeCasket.app/Resources')
          source=pathlib.Path('ios/TimeCasket/Resources')
          for path in source.rglob('*'):
              if path.is_file():
                  target=app/path.relative_to(source)
                  assert target.is_file(),str(target)
                  assert hashlib.sha256(target.read_bytes()).digest()==hashlib.sha256(path.read_bytes()).digest(),str(target)
          print('All runtime resources preserved byte for byte')
          PY
      - name: Package source and checksum
        run: |
          mkdir -p ios/release-assets
          cp ios/build/*.ipa ios/release-assets/
          git archive --format=zip HEAD -o ios/release-assets/time-casket-ios-source.zip
          cp ios/README.md ios/release-assets/README-ios.md
          (cd ios/release-assets && shasum -a 256 *.ipa *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: time-casket-ios-unsigned
          path: ios/release-assets/
          if-no-files-found: error
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: time-casket-ios-unsigned
          path: release-assets
      - name: Publish new iOS experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ios-v0.1.27-alpha.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release will not be overwritten.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title '时光匣 iOS 0.1.27 alpha.1（未签名实验版）' \
            --notes-file ios/RELEASE.md release-assets/*
