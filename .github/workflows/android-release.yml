name: Android signed Release APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml', 'tools/sign_android_release.py']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: android-signed-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      signed: ${{ steps.signing.outputs.available }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Detect whether long-term signing is configured
        id: signing
        env:
          ANDROID_RELEASE_SIGNING_JSON: ${{ secrets.ANDROID_RELEASE_SIGNING_JSON }}
        run: |
          python3 - <<'PY'
          import os,json
          raw=os.environ.get('ANDROID_RELEASE_SIGNING_JSON')
          available=bool(raw)
          if available:
              item=json.loads(raw)
              assert all(isinstance(item.get(k),str) and item[k] for k in ['keystore_base64','alias','store_password','key_password']), 'Signing secret has missing fields'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('available=' + str(available).lower() + '\n')
          print('Persistent signing configured' if available else 'Signing secret not configured: build an explicitly unsigned Release artifact; signed publication will be skipped')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore and verify the pinned patched engine
        run: |
          python3 ios/scripts/prepare_resources.py
          cp .cache/ios-verified-runtime.xpi .cache/ruffle-patched.xpi
      - name: Install SDK packages
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Regression tests
        run: |
          node --test tools/diagnostics.test.cjs tools/compatibility.test.cjs tools/player-options.test.cjs tools/engine-signals.test.cjs tools/audio-unlock.test.cjs tools/socket-config.test.cjs tools/game-control.test.cjs tools/game-view.test.cjs tools/game-http.test.cjs tools/audio-probe.test.cjs
          python3 -m unittest discover -s tools -p test_ruffle_archive.py -v
      - name: Build checked Release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Sign using the persistent release identity
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_RELEASE_SIGNING_JSON: ${{ secrets.ANDROID_RELEASE_SIGNING_JSON }}
        run: |
          python3 tools/sign_android_release.py \
            --tools "$ANDROID_HOME/build-tools/36.0.0" \
            --input app/build/outputs/apk/release/app-release-unsigned.apk \
            --output release-assets/time-casket-0.1.27-release.apk \
            --expected-cert e93924f77e71d2703b86d3c9ed4f6a0b89db0d09f059abf9c586facced80c40c
      - name: Prepare explicitly unsigned APK when signing is not configured
        if: steps.signing.outputs.available != 'true'
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-assets/time-casket-0.1.27-release-unsigned.apk
          printf '%s\n' 'This APK was compiled by GitHub Actions but is UNSIGNED and cannot be installed before signing. Configure ANDROID_RELEASE_SIGNING_JSON to sign and publish.' > release-assets/UNSIGNED.txt
      - name: Verify packaged resources and Release flags
        run: |
          apk=$(find release-assets -maxdepth 1 -name '*.apk' -print -quit)
          python3 tools/verify_ruffle_apk.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > release-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assert 'application-debuggable' not in Path('release-badging.txt').read_text()
          source=next(Path('app/build/generated/source/buildConfig/release').rglob('BuildConfig.java')).read_text()
          assert 'DEBUG = false' in source
          apk=next(Path('release-assets').glob('*.apk'))
          with apk.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          Path('release-assets/SHA256SUMS.txt').write_text(digest+'  '+apk.name+'\n')
          for old in Path('release-assets').glob('*.apk.sha256'): old.unlink()
          PY
          cp docs/android-release.md release-assets/README-android.md
      - uses: actions/upload-artifact@v4
        with:
          name: time-casket-android-release
          path: release-assets/
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: time-casket-android-release
          path: release-assets
      - name: Publish checked signed Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=android-v0.1.27-release.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release will not be overwritten.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title '时光匣 Android 0.1.27（Release，新长期签名）' \
            --notes-file docs/android-release-notes.md release-assets/*
