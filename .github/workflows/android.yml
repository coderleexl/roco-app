name: Android build and smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: |
          # The hosted image already includes SDK tools. New sdkmanager builds
          # may need Java 21; Gradle continues to use the pinned Java 17 above.
          JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;36.0.0' 2>&1 | tee sdk-build.log
      - name: Report SDK initialization errors
        if: failure()
        run: python tools/report_ci_failure.py sdk-build.log
      - name: Test diagnostic privacy
        run: node --test tools/diagnostics.test.cjs tools/compatibility.test.cjs tools/player-options.test.cjs
      - name: Build and verify
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee gradle-build.log
      - name: Report compilation errors
        if: failure()
        run: python tools/report_ci_failure.py gradle-build.log
      - name: Verify packaged Ruffle assets
        run: python tools/verify_ruffle_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roco-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/generated/ruffleAssets/ruffle-build.json
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: roco-debug-${{ github.sha }}
          path: apks
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual GeckoView/Ruffle smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python tools/run_instrumentation.py
      - name: Check official public entry (not a login/gameplay test)
        if: always()
        run: python tools/check_official.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: test-results/
