name: Android build and smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: android-${{ github.ref }}
  # Keep the running checks when a requested release is queued behind them.
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[release]') }}
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test engine archive boundaries
        run: python -m unittest discover -s tools -p test_ruffle_archive.py -v
      - uses: actions/cache@v4
        id: engine-cache
        with:
          path: .cache/ruffle-patched.xpi
          key: ruffle-loader-v1-${{ hashFiles('third-party/ruffle*.json', 'third-party/patches/*.patch', 'tools/build_ruffle_engine.py', 'tools/ruffle_archive.py') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Install JPEG XR build dependencies
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-18-dev
      - name: Install pinned wasm-bindgen
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Install upstream-matched wasm-opt
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: sigoden/install-binary@v1
        with:
          repo: WebAssembly/binaryen
          tag: version_129
          name: wasm-opt
      - name: Build source-patched standard and MVP engines
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          CC_wasm32_unknown_unknown: clang-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: python tools/build_ruffle_engine.py 2>&1 | tee ruffle-build.log
      - name: Reproduce upstream cancelled-image bug
        run: python tools/test_loader_images.py --expect baseline-bug --report test-results/loader-baseline.json
      - name: Verify cancelled-image fix in the rebuilt engine
        run: python tools/test_loader_images.py --archive .cache/ruffle-patched.xpi --expect fixed --report test-results/loader-fixed.json
      - uses: actions/upload-artifact@v4
        with:
          name: ruffle-engine-${{ github.sha }}
          path: .cache/ruffle-patched.xpi
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-reports
          path: |
            ruffle-build.log
            test-results/loader-*.json
  build:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ruffle-engine-${{ github.sha }}
          path: .cache
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: |
          # The hosted image already includes SDK tools. New sdkmanager builds
          # may need Java 21; Gradle continues to use the pinned Java 17 above.
          JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;36.0.0' 2>&1 | tee sdk-build.log
      - name: Report SDK initialization errors
        if: failure()
        run: python tools/report_ci_failure.py sdk-build.log
      - name: Test compatibility and diagnostic privacy
        run: node --test tools/diagnostics.test.cjs tools/compatibility.test.cjs tools/player-options.test.cjs tools/engine-signals.test.cjs tools/audio-unlock.test.cjs tools/socket-config.test.cjs tools/game-control.test.cjs tools/game-view.test.cjs tools/game-http.test.cjs tools/audio-probe.test.cjs
      - name: Build and verify
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee gradle-build.log
      - name: Report compilation errors
        if: failure()
        run: python tools/report_ci_failure.py gradle-build.log
      - name: Verify packaged Ruffle assets
        run: python tools/verify_ruffle_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roco-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/generated/ruffleAssets/ruffle-build.json
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: roco-debug-${{ github.sha }}
          path: apks
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual GeckoView/Ruffle smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python tools/run_instrumentation.py
      - name: Check official public entry (not a login/gameplay test)
        if: always()
        run: python tools/check_official.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: test-results/
  release:
    needs: [engine, build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: roco-debug-${{ github.sha }}
          path: apks
      - name: Prepare checked APK and checksum
        run: python tools/prepare_release.py apks
      - name: Publish requested test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release-assets/VERSION)
          tag="v$version"
          # A published version is immutable here; never clobber assets/tags.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to reuse it for another build."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "时光匣 $version（测试版）" --prerelease \
            --notes-file "docs/releases/$version.md" \
            "release-assets/time-casket-$version-debug.apk" release-assets/SHA256SUMS.txt
